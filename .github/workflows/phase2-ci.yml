name: Phase 2 CI (NeonDB + Prisma + Vite + Jest)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Phase1/Phase2

    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Phase1/Phase2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema and generate Prisma 7 Client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Run Jest tests
        env:
          NODE_OPTIONS: --experimental-vm-modules
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test_db?schema=public' }}
        run: npm test

      - name: Build Phase 2 frontend (Vite)
        run: npm run build